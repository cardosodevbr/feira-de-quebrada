<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Feira da Quebrada</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-image">
            <img src="imagens/motoboy.jpg" alt="" class="imagem-lateral">
        </div>

        <div class="login-side">
            <div class="login-container">

                <!-- Botão X para fechar e voltar ao início -->
                <a href="inicio.html" class="btn-fechar" title="Voltar ao início">✕</a>

                <a href="inicio.html">
                    <img src="imagens/logo.png" class="logo" alt="Feira da Quebrada">
                </a>

                <h1>Acesse sua conta</h1>

                <form id="form-login">
                    
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                    <hr>

                    <button class="btn-entrar" type="submit">
                        Entrar
                    </button>

                    <p class="login-link">
                        Ainda não tem uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                    </p>

                </form>

            </div>
        </div>

    </div>

    <script type="module" src="login.js"></script>
    
<!-- ========================================== -->
<!-- VLibras e UserWay  Acessibilidade          -->
<!-- ========================================== -->

<!-- VLibras -->
<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<!-- UserWay -->
<script src="https://cdn.userway.org/widget.js" data-account="a1B2c3D4e5"></script>

<!-- Aqui ajusta o CSS do UserWay para ficar em acima do VLibras -->
<style>
    .userway-widget-btn,
    #userwayAccessibilityIcon,
    body .uaw-widget-btn {
        position: fixed !important;
        right: -10px !important;
        left: auto !important;
        bottom: -230px !important; 
        top: auto !important;
        z-index: 999999 !important;
    }
    
</style>
</body>
</html>
