<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Feira da Quebrada</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <!-- Foto lateral -->
        <div class="login-image">
            <img src="imagens/motoboy.jpg" alt="" class="imagem-lateral">
        </div>

        <!-- Área de login -->
        <div class="login-side">
            <div class="login-container">

                <!-- Logo com link para voltar ao Início -->
                <a href="inicio.html">
                    <img src="imagens/logo.png" class="logo" alt="Feira da Quebrada">
                </a>

                <h1>Acesse sua conta</h1>

                <!-- FORMULÁRIO DE LOGIN -->
                <form id="form-login">
                    
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                    <hr>

                    <button class="btn-entrar" type="submit">
                        Entrar
                    </button>

                    <p class="login-link">
                        Ainda não tem uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                    </p>

                </form>

            </div>
        </div>

    </div>

    <!-- Script de autenticação apontando para a pasta scripts/ -->
    <script type="module" src="login.js"></script>
</body>
</html>
