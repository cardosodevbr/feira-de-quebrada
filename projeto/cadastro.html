<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro Cliente</title>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img id="imagem-cadastro" src="imagens/trancista.png" alt="Imagem de cadastro">
        </div>

        <div class="form-wrapper">
            <div class="card">
                
                <!-- Botão X para fechar e voltar ao início -->
                <a href="inicio.html" class="btn-fechar" title="Voltar ao início">✕</a>

                <div class="logo">
                     <img src="imagens/logo.png" alt="Logo da Feira de Quebrada">
                </div>
                <div class="subtitulo">Cadastre sua conta</div>

                <div class="usuario">
                    <button type="button" class="btn-perfil ativo" id="btn-cliente">
                        Cliente
                    </button>

                    <button type="button" class="btn-perfil" id="btn-empreendedor">
                        Empreendedor
                    </button>
                </div>

                <form class="form-cliente">
                    <div class="input-group">
                        <label for="name-cliente">Nome Completo:</label>
                        <div class="input-box">
                            <img src="do-utilizador 1.png" alt="">
                            <input type="text" id="name-cliente" placeholder="Seu nome" required maxlength="100">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email-cliente">E-mail:</label>
                        <div class="input-box">
                            <img src="e-mail 1.png" alt="">
                            <input type="email" id="email-cliente" placeholder="Seu @email.com" required maxlength="120">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password-cliente">Senha:</label>
                        <div class="input-box">
                            <img src="trancar 5.png" alt="">
                            <input type="password" id="password-cliente" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="palavra-cliente">Palavra de Segurança:</label>

                        <div class="input-box">
                            <img src="trancar 5.png" alt="">
                            <input type="password" id="palavra-cliente" placeholder="Mínimo 8 caracteres" required minlength="8">
                        </div>

                        <small>*Esta palavra será usada para recuperar sua senha. Guarde-a bem.</small>
                    </div>
                    <hr>

                    <button type="submit" class="btn-submit"> Criar conta</button>
                    <p class="login-link">Já possui uma conta? <a href="login.html">Faça login</a></p>
    
                </form>

                <form class="form-empreendedor">
                    
                     <div class="input-group">
                        <label for="name-emp">Nome do Titular:</label>
                        <div class="input-box">
                            <img src="do-utilizador 1.png" alt="">
                            <input type="text" id="name-emp" placeholder="Seu nome" required maxlength="100">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email-emp">E-mail:</label>
                        <div class="input-box">
                            <img src="e-mail 1.png" alt="">
                            <input type="email" id="email-emp" placeholder="Seu @email.com" required maxlength="120">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password-emp">Senha:</label>
                        <div class="input-box">
                            <img src="trancar 5.png" alt="">
                            <input type="password" id="password-emp" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="palavra-emp">Palavra de Segurança:</label>

                        <div class="input-box">
                            <img src="trancar 5.png" alt="">
                            <input type="password" id="palavra-emp" placeholder="Mínimo 8 caracteres" required minlength="8">
                        </div>

                        <small>*Esta palavra será usada para recuperar sua senha. Guarde-a bem.</small>
                    </div>
                    <hr>

                    <button type="submit" class="btn-submit"> Criar conta</button>
                    <p class="login-link">Já possui uma conta? <a href="login.html">Faça login</a></p>
    
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="cadastro.js"></script>
    
<!-- ========================================== -->
<!-- VLibras e UserWay  Acessibilidade          -->
<!-- ========================================== -->

<!-- VLibras -->
<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<!-- UserWay -->
<script src="https://cdn.userway.org/widget.js" data-account="a1B2c3D4e5"></script>

    #userwayAccessibilityIcon,
    body .uaw-widget-btn {
        position: fixed !important;
        right: -10px !important;
        left: auto !important;
        bottom: -230px !important; 
        top: auto !important;
        z-index: 999999 !important;
    }
    
</style>
</body>
</html>
